version: "3.9"

services:
  organism:
    build: ./backend
    container_name: organism
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  cockpit:
    build: ./frontend
    container_name: cockpit
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    command: npm run dev -- --host
